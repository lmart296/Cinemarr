# cinemarr: Plex + request pipeline (Seerr -> Radarr/Sonarr -> qBittorrent)
#
# Start:      docker compose up -d
# Configure:  docker compose run --rm bootstrap
# Update:     docker compose pull && docker compose up -d
#
# Only Plex (32400) is meant to be reachable from other devices without
# BIND_IP. Never port-forward any of these ports on your router.
# Note: ports published by Docker bypass host firewalls like ufw, which is
# why the web UIs bind to BIND_IP (default 127.0.0.1 = this machine only).

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-env: &env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Etc/UTC}
  UMASK: "002"

x-after-init: &after-init
  init:
    condition: service_completed_successfully

services:
  # One-shot: creates the folder layout and fixes ownership, then exits.
  init:
    image: alpine:3.22
    restart: "no"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./scripts/init.sh:/init.sh:ro
      - ${CONFIG_DIR:-./config}:/cfg
      - ${DATA_DIR:-./data}:/data
    command: ["sh", "/init.sh"]

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    <<: *hardening
    depends_on: *after-init
    environment:
      <<: *env
      VERSION: docker
      PLEX_CLAIM: ${PLEX_CLAIM:-}
    volumes:
      - ${CONFIG_DIR:-./config}/plex:/config
      # Read-only: even a compromised Plex cannot change or delete your media.
      - ${DATA_DIR:-./data}/media:/data/media:ro

  # Docker Desktop (macOS/Windows) hides each device's address: Plex would see
  # every connection coming from the Docker VM, treat your TVs as remote, and
  # refuse the first sign-in. This relay makes connections arrive from Plex's
  # own network, which Plex counts as local. Because of that, never
  # port-forward 32400 with this setup.
  # Linux doesn't need it (compose.linux.yaml turns it off).
  plex-lan:
    image: haproxy:3.4-alpine
    container_name: plex-lan
    <<: *hardening
    cap_drop:
      - ALL
    depends_on:
      - plex
    configs:
      - source: plex-lan
        target: /usr/local/etc/haproxy/haproxy.cfg
    ports:
      - "32400:32400"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    <<: *hardening
    depends_on: *after-init
    environment:
      <<: *env
      WEBUI_PORT: "8080"
    volumes:
      - ${CONFIG_DIR:-./config}/qbittorrent:/config
      # Only the downloads folder. The torrent client never sees the library.
      - ${DATA_DIR:-./data}/torrents:/data/torrents
    ports:
      - ${BIND_IP:-127.0.0.1}:8080:8080
    # No peer port is published: no inbound connections from the swarm.

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    <<: *hardening
    depends_on: *after-init
    environment: *env
    volumes:
      - ${CONFIG_DIR:-./config}/prowlarr:/config
    ports:
      - ${BIND_IP:-127.0.0.1}:9696:9696

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    <<: *hardening
    depends_on: *after-init
    environment: *env
    volumes:
      - ${CONFIG_DIR:-./config}/radarr:/config
      # Whole data tree in one mount so imports are instant hardlinks.
      - ${DATA_DIR:-./data}:/data
    ports:
      - ${BIND_IP:-127.0.0.1}:7878:7878

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    <<: *hardening
    depends_on: *after-init
    environment: *env
    volumes:
      - ${CONFIG_DIR:-./config}/sonarr:/config
      - ${DATA_DIR:-./data}:/data
    ports:
      - ${BIND_IP:-127.0.0.1}:8989:8989

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    <<: *hardening
    depends_on: *after-init
    user: "${PUID:-1000}:${PGID:-1000}"
    cap_drop:
      - ALL
    environment:
      TZ: ${TZ:-Etc/UTC}
      LOG_LEVEL: info
    volumes:
      - ${CONFIG_DIR:-./config}/seerr:/app/config
    ports:
      - ${BIND_IP:-127.0.0.1}:5055:5055
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

  # Not started by "up". Run once after first start:
  #   docker compose run --rm bootstrap
  bootstrap:
    image: python:3.12-alpine
    profiles: ["tools"]
    stdin_open: true
    tty: true
    environment:
      PLEX_HOST: plex
      PLEX_VIA_RELAY: "true"
      SERVER_IP: ${SERVER_IP:-}
      LAN_SUBNET: ${LAN_SUBNET:-192.168.1.0/24}
      PLEX_REMOTE_ACCESS: ${PLEX_REMOTE_ACCESS:-false}
    volumes:
      - ./bootstrap:/app:ro
      - ${CONFIG_DIR:-./config}:/cfg:ro
    command: ["python", "-u", "/app/bootstrap.py"]

configs:
  # Plain TCP relay; Plex sees the relay's address, not the device's.
  plex-lan:
    content: |
      resolvers docker
        nameserver dns 127.0.0.11:53
      defaults
        mode tcp
        timeout connect 5s
        timeout client 1h
        timeout server 1h
      frontend lan
        bind :32400
        default_backend plex
      backend plex
        # Re-resolved via Docker's DNS, so it follows Plex if it's recreated.
        server plex plex:32400 resolvers docker init-addr none
